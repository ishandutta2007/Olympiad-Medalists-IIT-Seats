<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Card/Border Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(14px) scale(0.96); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }
    @keyframes orbitSlide {
      0% { transform: translateX(0px); }
      50% { transform: translateX(20px); }
      100% { transform: translateX(0px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }

    .bg-grid {
      stroke: #334155;
      stroke-width: 0.7;
      stroke-opacity: 0.2;
    }
    .orb-1 {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseGlow 8s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .orb-3 {
      animation: pulseGlow 7s ease-in-out infinite alternate;
      transform-origin: 600px 380px;
    }
    .badge-float-1 {
      animation: floatSlow 5s ease-in-out infinite;
    }
    .badge-float-2 {
      animation: floatReverse 6s ease-in-out infinite;
    }
    .badge-float-3 {
      animation: floatSlow 5.5s ease-in-out infinite 1s;
    }
    .badge-float-4 {
      animation: floatReverse 6.5s ease-in-out infinite 0.5s;
    }
    .badge-float-5 {
      animation: floatSlow 7s ease-in-out infinite 1.5s;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dashCycle 8s linear infinite;
    }
    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .banner-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Animated Ambient Orbs in Background -->
  <circle class="orb-1" cx="220" cy="110" r="180" fill="url(#glowCyan)" />
  <circle class="orb-2" cx="980" cy="310" r="220" fill="url(#glowPurple)" />
  <circle class="orb-3" cx="620" cy="390" r="160" fill="url(#glowAmber)" />

  <!-- Grid Lines (Background decoration) -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Flowing Dynamic Animated Lines (Background Layer) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 60,340 C 260,260 400,380 650,330 C 900,280 1020,360 1140,320" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 60,80 C 300,160 500,60 760,110 C 980,160 1080,90 1140,110" fill="none" stroke="#c084fc" stroke-width="1.8" />
  </g>

  <!-- Animated Floating Category Pills (Positioned around lower edges to keep center text crisp and unobstructed) -->
  <g class="badge-float-1" transform="translate(120, 315)">
    <rect width="160" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.92" filter="url(#shadow)" />
    <circle cx="22" cy="19" r="6" fill="#38bdf8" />
    <text x="36" y="24" fill="#e2e8f0" class="pill-text">📐 IMO / IMOTC</text>
  </g>

  <g class="badge-float-2" transform="translate(320, 315)">
    <rect width="155" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.92" filter="url(#shadow)" />
    <circle cx="22" cy="19" r="6" fill="#818cf8" />
    <text x="36" y="24" fill="#e2e8f0" class="pill-text">💻 IOI / IOITC</text>
  </g>

  <g class="badge-float-3" transform="translate(515, 315)">
    <rect width="165" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.92" filter="url(#shadow)" />
    <circle cx="22" cy="19" r="6" fill="#ec4899" />
    <text x="36" y="24" fill="#e2e8f0" class="pill-text">⚡ IPhO / Physics</text>
  </g>

  <g class="badge-float-4" transform="translate(720, 315)">
    <rect width="175" height="38" rx="19" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" opacity="0.92" filter="url(#shadow)" />
    <circle cx="22" cy="19" r="6" fill="#f59e0b" />
    <text x="36" y="24" fill="#e2e8f0" class="pill-text">🧪 IChO / Chemistry</text>
  </g>

  <g class="badge-float-5" transform="translate(935, 315)">
    <rect width="155" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.92" filter="url(#shadow)" />
    <circle cx="22" cy="19" r="6" fill="#10b981" />
    <text x="36" y="24" fill="#e2e8f0" class="pill-text">🧬 IBO / Biology</text>
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(470, 48)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.8" />
    <circle cx="20" cy="16" r="4.5" fill="#10b981" filter="url(#glowEffect)" />
    <text x="35" y="21" fill="#94a3b8" class="pill-text">ACADEMIC YEAR 2026 – 2027</text>
  </g>

  <!-- FOREGROUND: Main Title & Subtitle (Always in front, crystal-clear contrast) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Main Title -->
    <text x="0" y="0" fill="url(#titleGrad)" class="banner-title" filter="url(#shadow)">
      Olympiad Medalists IIT Direct Admission Seats
    </text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="50" class="banner-sub">
      Supernumerary Quotas &amp; Direct Entry Pathways Across Premier Indian Institutes of Technology
    </text>

    <!-- Subtitle Line 2 (Key Highlights) -->
    <text x="0" y="84" class="banner-sub" font-size="15px" fill="#94a3b8">
      Direct Evaluation &bull; International Medalists &bull; National Training Campers (IMOTC / IOITC / OCSC)
    </text>
  </g>

</svg>
